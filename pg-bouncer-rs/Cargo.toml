[package]
name = "pg-bouncer-rs"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded PostgreSQL connection pooler (PgBouncer-style)"

[[bin]]
name = "pg-bouncer-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
md5 = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
