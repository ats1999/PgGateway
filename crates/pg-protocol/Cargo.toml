[package]
name = "pg-protocol"
description = "PostgreSQL wire protocol framing and async I/O"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
