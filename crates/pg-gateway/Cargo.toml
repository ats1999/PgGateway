[package]
name = "pg-gateway"
description = "PostgreSQL proxy gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pg-gateway"
path = "src/main.rs"

[[test]]
name = "integration_pool"
path = "tests/e2e/pool.rs"

[[test]]
name = "integration_admin"
path = "tests/e2e/admin.rs"

[[test]]
name = "proxy_e2e"
path = "tests/e2e/proxy_e2e.rs"

[[test]]
name = "pool_e2e"
path = "tests/e2e/pool_e2e.rs"

[[test]]
name = "integration_pool_config"
path = "tests/e2e/pool_config_e2e.rs"

[[test]]
name = "integration_dbname_auth"
path = "tests/e2e/dbname_auth_e2e.rs"

[[test]]
name = "e2e"
path = "tests/e2e/e2e.rs"

[dependencies]
anyhow = "1"
bytes = "1"
hcl-rs = "0.18"
pg-protocol = { path = "../pg-protocol" }
# md5 / SCRAM-SHA-256 client auth for gateway-initiated upstream logins.
postgres-protocol = "0.6"
# Random md5 salt for gateway-side client password checks.
rand = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
pg-protocol = { path = "../pg-protocol" }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
anyhow = "1"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tempfile = "3.27.0"
hcl-rs = "0.18"
