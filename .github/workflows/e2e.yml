name: e2e

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain

      # - name: Run formatting check
      #   run: cargo fmt --all -- --check
      #   shell: bash

      # - name: Run Clippy
      #   run: cargo clippy --workspace --all-targets -- -- -D warnings
      #   shell: bash

      - name: Unit Tests
        shell: bash
        run: |
          cargo test -p pg-protocol
          cargo test -p pg-gateway --lib
          cargo test -p pg-gateway \
            --test integration_pool \
            --test integration_admin \
            --test proxy_e2e \
            --test pool_e2e \
            --test integration_pool_config \
            --test integration_dbname_auth

  e2e:
    name: e2e Tests
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain

      - name: Build PG Gateway Docker image
        shell: bash
        run: docker build -t pg-gateway:latest -f docker/Dockerfile .

      - name: Run E2E tests
        shell: bash
        run: cargo test -p pg-gateway --test e2e -- --nocapture